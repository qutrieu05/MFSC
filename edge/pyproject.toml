[project]
name = "msfc-edge"
version = "0.1.0"
description = "Mini Smart Factory Cell - Edge Server (vision, decision, MQTT, storage, dashboard)"
requires-python = ">=3.11"
# Phase 0 started with ZERO runtime dependencies (stdlib only, see ADR-0007/0008/0009).
# Dependencies are added per phase and each one must be justified in DECISIONS.md.
# fastapi/uvicorn: Official Web Dashboard phase (D-064) -- local backend/API server for the
# dashboard, chosen for minimal footprint + native async/WebSocket support + auto OpenAPI docs.
dependencies = ["fastapi>=0.110", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx: required by starlette.testclient (dashboard tests)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hil: requires real hardware in the loop (skipped by default)",
  "slow: long-running stability test",
]

[tool.ruff]
# Optional linter config; ruff is NOT a required dependency in Phase 0.
line-length = 110
target-version = "py311"

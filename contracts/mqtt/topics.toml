# MSFC MQTT topic registry — SINGLE SOURCE OF TRUTH for topics (FR-COM-02).
# Code must load topics from this file (Python) or from headers generated from it (firmware).
# Human-readable specification: docs/MQTT_CONTRACT.md
#
# Topic grammar: {root}/{line_id}/{subsystem}/{device_id}/{class}[/{name}]
# status: "active" = specified for its phase; "draft" = reserved, payload may change.

contract_version = "0.1.0"
root = "factory"
default_line_id = "line01"
message_classes = ["status", "state", "heartbeat", "event", "telemetry", "cmd", "ack", "fault"]
subsystems = ["conveyor", "system", "vision", "decision", "safety", "ocr", "oee", "health"]

# ---------------------------------------------------------------- conveyor (ESP32 Cell Controller, N1)
[[topic]]
key = "conveyor.status"
pattern = "factory/{line_id}/conveyor/{device_id}/status"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 1
retain = true
schema = "device_status.v1"
rate = "on connect/disconnect (Last Will)"
phase = 1
status = "active"

[[topic]]
key = "conveyor.state"
pattern = "factory/{line_id}/conveyor/{device_id}/state"
publisher = "cell_controller"
subscribers = ["edge_server", "dashboard"]
qos = 1
retain = true
schema = "cell_state.v1"
rate = "on change + every 5 s"
phase = 1
status = "active"

[[topic]]
key = "conveyor.heartbeat"
pattern = "factory/{line_id}/conveyor/{device_id}/heartbeat"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 0
retain = false
schema = "device_heartbeat.v1"
rate = "1 Hz"
phase = 1
status = "active"

[[topic]]
key = "conveyor.event.product_detected"
pattern = "factory/{line_id}/conveyor/{device_id}/event/product_detected"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 1
retain = false
schema = "product_detected.v1"
rate = "per product"
phase = 1
status = "active"

[[topic]]
key = "conveyor.event.product_sorted"
pattern = "factory/{line_id}/conveyor/{device_id}/event/product_sorted"

pattern = "factory/{line_id}/conveyor/{device_id}/event/state_changed"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 1
retain = false
schema = "state_changed.v1"
rate = "on change"
phase = 1
status = "active"

[[topic]]
key = "conveyor.fault"
pattern = "factory/{line_id}/conveyor/{device_id}/fault"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 1
retain = false
schema = "fault.v1"
rate = "on raise/clear"
phase = 1
status = "active"

[[topic]]
key = "conveyor.telemetry.timing"
pattern = "factory/{line_id}/conveyor/{device_id}/telemetry/timing"
publisher = "cell_controller"
subscribers = ["edge_server"]
qos = 0
retain = false
schema = "timing_stats.v1"
rate = "every 10 s while RUNNING"
phase = 1
status = "active"

[[topic]]
key = "conveyor.cmd.verdict"
pattern = "factory/{line_id}/conveyor/{device_id}/cmd/verdict"
publisher = "edge_server"
subscribers = ["cell_controller"]
qos = 1
retain = false
schema = "verdict_cmd.v1"
rate = "per product"
phase = 1
status = "active"

[[topic]]
key = "conveyor.cmd.control"
pattern = "factory/{line_id}/conveyor/{device_id}/cmd/control"
publisher = "edge_server"
subscribers = ["cell_controller"]
qos = 1
retain = false
schema = "control_cmd.v1"
rate = "on operator action"
